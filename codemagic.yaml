workflows:
  ios-workflow:
    name: Love Choice iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: YOUR_INTEGRATION_NAME

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS
        script: flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
