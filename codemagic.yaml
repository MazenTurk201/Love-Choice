workflows:
  love-choice-ios-unsigned:
    name: Love Choice - Unsigned iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS without signing
        script: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa/Payload

          cp -R build/ios/iphoneos/Runner.app \
            build/ios/ipa/Payload/

          cd build/ios/ipa

          zip -qry LoveChoice-unsigned.ipa Payload

          echo "IPA created:"
          ls -lh LoveChoice-unsigned.ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
